[package]
name = "broche-core"
description = "Broche engine: identity, pairing, sessions and storage"
license = "MPL-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Seal the device key with a wrapping key kept in the desktop keyring (Linux).
secret-service = ["dep:oo7"]

[dependencies]
broche-adb.workspace = true
broche-protocol.workspace = true
iroh.workspace = true
iroh-mdns-address-lookup.workspace = true
material-colors.workspace = true
n0-future.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
bytes.workspace = true
data-encoding.workspace = true
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15"
sha2.workspace = true
socket2 = "0.6"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"], optional = true }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
